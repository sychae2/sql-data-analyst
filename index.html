<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마케팅 캠페인 성과분석 자동화</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7fff2;
      --surface: #ffffff;
      --surface-2: #f0ffe8;
      --line: #dfead8;
      --text: #1d2633;
      --muted: #667587;
      --brand: #559732;
      --brand-2: #438321;
      --good: #559732;
      --bad: #ee7f7b;
      --flat: #697386;
      --warn: #9a6700;
      --shadow: 0 10px 28px rgba(23, 36, 54, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }

    button, input, select {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding: 8px 0 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.2;
      font-weight: 760;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .privacy-note {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--surface);
      font-size: 13px;
      white-space: nowrap;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .overview {
      display: grid;
      grid-template-columns: minmax(270px, .72fr) minmax(360px, 1.28fr);
      gap: 14px;
      margin-bottom: 16px;
    }

    .today-card {
      padding: 20px;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .today-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 680;
    }

    .today-value {
      margin-top: 10px;
      font-size: clamp(38px, 5vw, 54px);
      line-height: 1;
      font-weight: 820;
    }

    .today-date {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .delta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .delta-chip {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px;
      background: #fbfcfe;
    }

    .delta-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .delta-value {
      font-size: 18px;
      font-weight: 780;
    }

    .chart-card {
      padding: 18px;
      min-height: 190px;
    }

    .bar-chart {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 78px 1fr 94px;
      gap: 12px;
      align-items: center;
    }

    .bar-label {
      color: #435064;
      font-size: 13px;
      font-weight: 720;
    }

    .bar-track {
      height: 16px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      min-width: 4px;
      border-radius: inherit;
      background: var(--brand);
    }

    .bar-fill.previous-day { background: #f3aeac; }
    .bar-fill.previous-month { background: #ee7f7b; }

    .bar-value {
      color: #344154;
      font-size: 13px;
      font-weight: 720;
      text-align: right;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .section {
      padding: 18px;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 760;
      color: #344154;
    }

    .search-row, .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
      min-height: 40px;
      padding: 0 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }

    .btn:hover {
      background: #f9fbfd;
      border-color: #bdc8d6;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      font-weight: 720;
    }

    .btn.primary:hover {
      background: var(--brand-2);
      border-color: var(--brand-2);
    }

    .input {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 12px;
      color: var(--text);
      background: #fff;
      outline: none;
      min-width: 230px;
    }

    .input:focus, select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(31, 111, 235, .12);
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
    }

    .message {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      display: none;
    }

    .message.show { display: block; }
    .message.error { border-color: #f2b8b5; background: #fff4f3; color: #9d2721; }
    .message.success { border-color: #b9dfcc; background: #f0fbf5; color: #12643f; }
    .message.warn { border-color: #ead49a; background: #fff8df; color: var(--warn); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 92px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 22px;
      line-height: 1.15;
      font-weight: 780;
      overflow-wrap: anywhere;
    }

    .metric-sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .table-panel {
      overflow: hidden;
    }

    .table-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    select {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 10px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 780px;
    }

    th, td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
    }

    th:first-child, td:first-child {
      text-align: left;
    }

    th {
      color: #435064;
      font-size: 13px;
      background: #fbfcfe;
      user-select: none;
      cursor: pointer;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    th .sort {
      color: var(--muted);
      margin-left: 5px;
      font-size: 11px;
    }

    tbody tr:hover {
      background: #f8fbff;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 720;
      font-size: 12px;
    }

    .status.up { background: #eaf7ef; color: var(--good); }
    .status.down { background: #fff0ef; color: var(--bad); }
    .status.flat { background: #eef1f5; color: var(--flat); }
    .positive { color: var(--good); font-weight: 720; }
    .negative { color: var(--bad); font-weight: 720; }
    .empty {
      padding: 42px 18px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 980px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }
      .privacy-note { white-space: normal; }
      .overview { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100vw - 20px, 1180px);
        padding-top: 18px;
      }
      .summary-grid { grid-template-columns: 1fr; }
      .delta-grid { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 64px 1fr; }
      .bar-value { grid-column: 2; text-align: left; }
      .input, .btn, select { width: 100%; }
      .table-head {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>마케팅 캠페인 성과분석 자동화</h1>
        <p class="subtitle">캠페인 ID 기준으로 발송 전후 총손님과 교차지수 16개 항목 변화를 비교합니다.</p>
      </div>
      <div class="privacy-note">단일 HTML 화면에서 캠페인 성과를 빠르게 확인합니다.</div>
    </header>

    <section class="overview" aria-label="총손님 현황">
      <article class="panel today-card">
        <div>
          <div class="today-label">오늘 기준 총 손님 수</div>
          <div id="todayTotal" class="today-value">0</div>
          <div id="todayDate" class="today-date"></div>
        </div>
        <div class="delta-grid">
          <div class="delta-chip">
            <div class="delta-label">전일 대비</div>
            <div id="dayDelta" class="delta-value">0</div>
          </div>
          <div class="delta-chip">
            <div class="delta-label">전월 대비</div>
            <div id="monthDelta" class="delta-value">0</div>
          </div>
        </div>
      </article>

      <article class="panel chart-card">
        <h2 class="section-title">총손님 수 비교</h2>
        <div id="customerBars" class="bar-chart"></div>
      </article>
    </section>

    <section class="controls">
      <div class="panel section">
        <h2 class="section-title">캠페인 조회</h2>
        <div class="search-row">
          <input id="campaignInput" class="input" type="text" placeholder="캠페인 ID 입력">
          <button id="analyzeBtn" class="btn primary" type="button">분석 실행</button>
          <button id="resetBtn" class="btn" type="button">초기화</button>
        </div>
        <div class="meta" style="margin-top:10px;">예시 캠페인 ID: CMP001, CMP002</div>
      </div>
    </section>

    <div id="message" class="message"></div>

    <section id="summary" class="summary-grid" aria-live="polite"></section>

    <section class="panel table-panel">
      <div class="table-head">
        <div>
          <h2 class="section-title" style="margin-bottom:4px;">교차지수 항목별 성과</h2>
          <div id="resultCount" class="meta">분석 결과 0건</div>
        </div>
        <div class="toolbar">
          <label class="meta" for="statusFilter">상태</label>
          <select id="statusFilter">
            <option value="전체">전체</option>
            <option value="증가">증가</option>
            <option value="감소">감소</option>
            <option value="유지">유지</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-sort="itemName">항목명 <span class="sort"></span></th>
              <th data-sort="before">캠페인 전 <span class="sort"></span></th>
              <th data-sort="after">캠페인 후 <span class="sort"></span></th>
              <th data-sort="change">증감 <span class="sort"></span></th>
              <th data-sort="changeRate">증감률 <span class="sort"></span></th>
              <th data-sort="status">상태 <span class="sort"></span></th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="6" class="empty">캠페인 ID를 입력하면 결과가 표시됩니다.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const CROSS_ITEMS = [
      ["cross_01", "적립식"],
      ["cross_02", "거치식"],
      ["cross_03", "신탁"],
      ["cross_04", "집합투자"],
      ["cross_05", "방카"],
      ["cross_06", "청약"],
      ["cross_07", "개인연금"],
      ["cross_08", "퇴직연금"],
      ["cross_09", "담보대출"],
      ["cross_10", "기타대출"],
      ["cross_11", "요구불"],
      ["cross_12", "입금이체"],
      ["cross_13", "출금이체"],
      ["cross_14", "디지털"],
      ["cross_15", "환전송금"],
      ["cross_16", "하나머니"]
    ];

    const ITEM_ALIASES = {
      cross_01: ["cross_01", "cross01", "item_01", "item01", "installment_savings_satisfied", "적립식"],
      cross_02: ["cross_02", "cross02", "item_02", "item02", "lump_savings_satisfied", "거치식"],
      cross_03: ["cross_03", "cross03", "item_03", "item03", "trust_satisfied", "신탁"],
      cross_04: ["cross_04", "cross04", "item_04", "item04", "fund_satisfied", "집합투자"],
      cross_05: ["cross_05", "cross05", "item_05", "item05", "bancassurance_satisfied", "방카"],
      cross_06: ["cross_06", "cross06", "item_06", "item06", "subscription_savings_satisfied", "청약"],
      cross_07: ["cross_07", "cross07", "item_07", "item07", "personal_pension_satisfied", "개인연금"],
      cross_08: ["cross_08", "cross08", "item_08", "item08", "retirement_pension_satisfied", "퇴직연금"],
      cross_09: ["cross_09", "cross09", "item_09", "item09", "mortgage_loan_satisfied", "담보대출"],
      cross_10: ["cross_10", "cross10", "item_10", "item10", "other_loan_satisfied", "기타대출"],
      cross_11: ["cross_11", "cross11", "item_11", "item11", "salary_transfer_satisfied", "요구불"],
      cross_12: ["cross_12", "cross12", "item_12", "item12", "auto_transfer_satisfied", "입금이체"],
      cross_13: ["cross_13", "cross13", "item_13", "item13", "withdrawal_transfer_satisfied", "출금이체"],
      cross_14: ["cross_14", "cross14", "item_14", "item14", "digital_satisfied", "디지털"],
      cross_15: ["cross_15", "cross15", "item_15", "item15", "fx_remittance_satisfied", "환전송금"],
      cross_16: ["cross_16", "cross16", "item_16", "item16", "hana_money_satisfied", "하나머니"]
    };

    const CUSTOMER_OVERVIEW = {
      todayTotal: 25000000,
      yesterdayTotal: 24910000,
      previousMonthTotal: 24680000
    };

    const DEFAULT_ROWS = [
      {
        campaign_id: "CMP001",
        campaign_name: "6월 예금 캠페인",
        before_total_customers: 12480,
        after_total_customers: 13260,
        before_cross_01: 4280,
        after_cross_01: 4720,
        before_cross_02: 3890,
        after_cross_02: 4050,
        before_cross_03: 1320,
        after_cross_03: 1410,
        before_cross_04: 2110,
        after_cross_04: 2250,
        before_cross_05: 980,
        after_cross_05: 940,
        before_cross_06: 2720,
        after_cross_06: 2890,
        before_cross_07: 1560,
        after_cross_07: 1680,
        before_cross_08: 1180,
        after_cross_08: 1210,
        before_cross_09: 820,
        after_cross_09: 800,
        before_cross_10: 1460,
        after_cross_10: 1510,
        before_cross_11: 7020,
        after_cross_11: 7360,
        before_cross_12: 5120,
        after_cross_12: 5480,
        before_cross_13: 4860,
        after_cross_13: 4820,
        before_cross_14: 6590,
        after_cross_14: 7040,
        before_cross_15: 1120,
        after_cross_15: 1260,
        before_cross_16: 1760,
        after_cross_16: 1760
      },
      {
        campaign_id: "CMP002",
        campaign_name: "디지털 활성 캠페인",
        before_total_customers: 9620,
        after_total_customers: 10140,
        before_cross_01: 3120,
        after_cross_01: 3180,
        before_cross_02: 2210,
        after_cross_02: 2190,
        before_cross_03: 910,
        after_cross_03: 980,
        before_cross_04: 1840,
        after_cross_04: 1910,
        before_cross_05: 720,
        after_cross_05: 740,
        before_cross_06: 1980,
        after_cross_06: 2040,
        before_cross_07: 1010,
        after_cross_07: 1050,
        before_cross_08: 840,
        after_cross_08: 820,
        before_cross_09: 620,
        after_cross_09: 610,
        before_cross_10: 1120,
        after_cross_10: 1160,
        before_cross_11: 5220,
        after_cross_11: 5380,
        before_cross_12: 4110,
        after_cross_12: 4320,
        before_cross_13: 3380,
        after_cross_13: 3360,
        before_cross_14: 4920,
        after_cross_14: 5580,
        before_cross_15: 760,
        after_cross_15: 840,
        before_cross_16: 1360,
        after_cross_16: 1440
      }
    ];

    const state = {
      rows: DEFAULT_ROWS,
      headers: Object.keys(DEFAULT_ROWS[0]),
      result: null,
      filter: "전체",
      sortKey: null,
      sortDir: "asc"
    };

    const todayTotal = document.getElementById("todayTotal");
    const todayDate = document.getElementById("todayDate");
    const dayDelta = document.getElementById("dayDelta");
    const monthDelta = document.getElementById("monthDelta");
    const customerBars = document.getElementById("customerBars");
    const campaignInput = document.getElementById("campaignInput");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const resetBtn = document.getElementById("resetBtn");
    const message = document.getElementById("message");
    const summary = document.getElementById("summary");
    const statusFilter = document.getElementById("statusFilter");
    const resultCount = document.getElementById("resultCount");
    const tableBody = document.getElementById("tableBody");

    analyzeBtn.addEventListener("click", runAnalysis);
    resetBtn.addEventListener("click", resetAnalysis);
    statusFilter.addEventListener("change", () => {
      state.filter = statusFilter.value;
      renderPerformanceTable();
    });
    document.querySelectorAll("th[data-sort]").forEach((th) => {
      th.addEventListener("click", () => sortPerformanceTable(th.dataset.sort));
    });
    campaignInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") runAnalysis();
    });
    renderCustomerOverview();
    renderInitialState();

    function normalizeKey(value) {
      return String(value || "").trim().toLowerCase().replace(/\s+/g, "_");
    }

    function buildHeaderMap(row) {
      const map = new Map();
      Object.keys(row || {}).forEach((key) => map.set(normalizeKey(key), key));
      return map;
    }

    function getValue(row, names) {
      const map = buildHeaderMap(row);
      for (const name of names) {
        const actual = map.get(normalizeKey(name));
        if (actual !== undefined) return row[actual];
      }
      return undefined;
    }

    function toNumber(value) {
      if (value === null || value === undefined || value === "") return 0;
      if (typeof value === "number") return Number.isFinite(value) ? value : 0;
      const cleaned = String(value).replace(/,/g, "").trim();
      const parsed = Number(cleaned);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function isYes(value) {
      const normalized = String(value ?? "").trim().toLowerCase();
      return ["y", "yes", "1", "true", "t", "만족", "대상", "총손님"].includes(normalized);
    }

    function getCampaignId(row) {
      return String(getValue(row, ["campaign_id", "campaignid", "캠페인id", "캠페인_id", "캠페인 ID"]) ?? "").trim();
    }

    function getCampaignName(row, fallback) {
      return String(getValue(row, ["campaign_name", "campaignname", "캠페인명", "캠페인_name"]) || fallback || "-");
    }

    function runAnalysis() {
      const campaignId = campaignInput.value.trim();
      if (!state.rows.length) {
        showMessage("분석 데이터가 없습니다. 기본 데이터 연결 상태를 확인하세요.", "error");
        return;
      }
      if (!campaignId) {
        showMessage("캠페인 ID를 입력하세요.", "error");
        campaignInput.focus();
        return;
      }

      const campaignRows = state.rows.filter((row) => getCampaignId(row) === campaignId);
      if (!campaignRows.length) {
        showMessage(`캠페인 ID '${campaignId}'에 해당하는 데이터가 없습니다.`, "error");
        state.result = null;
        renderInitialState();
        return;
      }

      try {
        state.result = calculateCampaignPerformance(campaignId, campaignRows);
        state.filter = "전체";
        statusFilter.value = "전체";
        clearSort();
        renderSummaryCards();
        renderPerformanceTable();
        showMessage("분석이 완료되었습니다.", "success");
      } catch (error) {
        state.result = null;
        renderInitialState();
        showMessage(error.message || "분석 중 오류가 발생했습니다.", "error");
      }
    }

    function calculateCampaignPerformance(campaignId, rows) {
      const aggregateRow = rows.find((row) => hasAggregateColumns(row));
      const result = aggregateRow
        ? calculateFromAggregateRow(campaignId, aggregateRow)
        : calculateFromCustomerRows(campaignId, rows);
      result.upCount = result.items.filter((item) => item.status === "증가").length;
      result.downCount = result.items.filter((item) => item.status === "감소").length;
      result.flatCount = result.items.filter((item) => item.status === "유지").length;
      return result;
    }

    function hasAggregateColumns(row) {
      return getValue(row, ["before_total_customers", "before_total_customer", "캠페인전_총손님수"]) !== undefined
        || getValue(row, ["after_total_customers", "after_total_customer", "캠페인후_총손님수"]) !== undefined
        || getValue(row, ["before_cross_01", "after_cross_01"]) !== undefined;
    }

    function calculateFromAggregateRow(campaignId, row) {
      const beforeTotal = toNumber(getValue(row, ["before_total_customers", "before_total_customer", "before_total", "캠페인전_총손님수", "전_총손님수"]));
      const afterTotal = toNumber(getValue(row, ["after_total_customers", "after_total_customer", "after_total", "캠페인후_총손님수", "후_총손님수"]));
      return {
        campaignId,
        campaignName: getCampaignName(row, campaignId),
        beforeTotal,
        afterTotal,
        totalChange: afterTotal - beforeTotal,
        totalChangeRate: calculateRate(afterTotal - beforeTotal, beforeTotal),
        items: CROSS_ITEMS.map(([key, label]) => {
          const before = toNumber(getValue(row, [`before_${key}`, `before${key}`, `before_${key.replace("_", "")}`, `${key}_before`, `전_${key}`]));
          const after = toNumber(getValue(row, [`after_${key}`, `after${key}`, `after_${key.replace("_", "")}`, `${key}_after`, `후_${key}`]));
          return buildItem(label, before, after);
        })
      };
    }

    function calculateFromCustomerRows(campaignId, rows) {
      const beforeRows = rows.filter((row) => getPeriod(row) === "before");
      const afterRows = rows.filter((row) => getPeriod(row) === "after");
      if (!beforeRows.length || !afterRows.length) {
        throwAnalysisWarning("고객별 데이터는 before/after를 구분하는 컬럼이 필요합니다. 예: period, base_period, 기준구분 값에 before/after 또는 전/후 입력");
      }

      const beforeTotal = countTotalCustomers(beforeRows);
      const afterTotal = countTotalCustomers(afterRows);
      return {
        campaignId,
        campaignName: getCampaignName(rows[0], campaignId),
        beforeTotal,
        afterTotal,
        totalChange: afterTotal - beforeTotal,
        totalChangeRate: calculateRate(afterTotal - beforeTotal, beforeTotal),
        items: CROSS_ITEMS.map(([key, label]) => {
          const before = countSatisfied(beforeRows, key);
          const after = countSatisfied(afterRows, key);
          return buildItem(label, before, after);
        })
      };
    }

    function throwAnalysisWarning(text) {
      throw new Error(text);
    }

    function getPeriod(row) {
      const raw = String(getValue(row, ["period", "base_period", "campaign_period", "before_after", "pre_post", "base_month_type", "기준구분", "전후구분", "기간구분"]) ?? "").trim().toLowerCase();
      if (["before", "pre", "b", "전", "사전", "이전", "before_campaign"].includes(raw)) return "before";
      if (["after", "post", "a", "후", "사후", "이후", "after_campaign"].includes(raw)) return "after";
      return "";
    }

    function countTotalCustomers(rows) {
      const customerIds = new Set();
      rows.forEach((row, index) => {
        const total = getValue(row, ["total_customer_yn", "total_customer", "총손님_yn", "총손님", "총손님여부"]);
        if (total === undefined || isYes(total)) {
          customerIds.add(getCustomerId(row, index));
        }
      });
      return customerIds.size;
    }

    function countSatisfied(rows, itemKey) {
      const customerIds = new Set();
      const aliases = ITEM_ALIASES[itemKey] || [itemKey];
      rows.forEach((row, index) => {
        const value = getValue(row, aliases);
        if (isYes(value)) customerIds.add(getCustomerId(row, index));
      });
      return customerIds.size;
    }

    function getCustomerId(row, index) {
      return String(getValue(row, ["customer_id", "customer_no", "customer_number", "손님번호", "고객번호", "손님_id"]) || `row_${index}`);
    }

    function buildItem(itemName, before, after) {
      const change = after - before;
      const status = change > 0 ? "증가" : change < 0 ? "감소" : "유지";
      return {
        itemName,
        before,
        after,
        change,
        changeRate: calculateRate(change, before),
        status
      };
    }

    function calculateRate(change, before) {
      return before === 0 ? 0 : (change / before) * 100;
    }

    function renderSummaryCards() {
      const result = state.result;
      if (!result) {
        summary.innerHTML = "";
        return;
      }
      const cards = [
        ["캠페인 ID", result.campaignId, result.campaignName],
        ["캠페인명", result.campaignName, ""],
        ["총손님 변화", signedNumber(result.totalChange), `${formatNumber(result.beforeTotal)} -> ${formatNumber(result.afterTotal)}`],
        ["총손님 증감률", formatPercent(result.totalChangeRate), ""],
        ["증가 항목", `${result.upCount}개`, ""],
        ["감소 항목", `${result.downCount}개`, ""],
        ["유지 항목", `${result.flatCount}개`, ""]
      ];
      summary.innerHTML = cards.map(([label, value, sub]) => `
        <article class="metric">
          <div class="metric-label">${escapeHtml(label)}</div>
          <div class="metric-value ${valueClass(value)}">${escapeHtml(value)}</div>
          ${sub ? `<div class="metric-sub">${escapeHtml(sub)}</div>` : ""}
        </article>
      `).join("");
    }

    function renderCustomerOverview() {
      const today = CUSTOMER_OVERVIEW.todayTotal;
      const yesterday = CUSTOMER_OVERVIEW.yesterdayTotal;
      const previousMonth = CUSTOMER_OVERVIEW.previousMonthTotal;
      const dayChange = today - yesterday;
      const monthChange = today - previousMonth;
      const maxValue = Math.max(today, yesterday, previousMonth);
      const rows = [
        ["오늘", today, "current"],
        ["전일", yesterday, "previous-day"],
        ["전월", previousMonth, "previous-month"]
      ];

      todayTotal.textContent = formatNumber(today);
      todayDate.textContent = new Date().toLocaleDateString("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "short"
      });
      dayDelta.textContent = `${signedNumber(dayChange)} (${formatPercent(calculateRate(dayChange, yesterday))})`;
      dayDelta.className = `delta-value ${numberClass(dayChange)}`;
      monthDelta.textContent = `${signedNumber(monthChange)} (${formatPercent(calculateRate(monthChange, previousMonth))})`;
      monthDelta.className = `delta-value ${numberClass(monthChange)}`;
      customerBars.innerHTML = rows.map(([label, value, className]) => {
        const width = Math.max(4, Math.round((value / maxValue) * 100));
        return `
          <div class="bar-row">
            <div class="bar-label">${label}</div>
            <div class="bar-track">
              <div class="bar-fill ${className}" style="width:${width}%"></div>
            </div>
            <div class="bar-value">${formatNumber(value)}</div>
          </div>
        `;
      }).join("");
    }

    function renderPerformanceTable() {
      if (!state.result) {
        renderInitialState();
        return;
      }

      let rows = state.result.items.slice();
      if (state.filter !== "전체") {
        rows = rows.filter((row) => row.status === state.filter);
      }
      if (state.sortKey) {
        rows.sort((a, b) => compareValues(a[state.sortKey], b[state.sortKey], state.sortDir));
      }

      resultCount.textContent = `분석 결과 ${formatNumber(rows.length)}건`;
      updateSortIndicators();
      if (!rows.length) {
        tableBody.innerHTML = `<tr><td colspan="6" class="empty">선택한 상태에 해당하는 항목이 없습니다.</td></tr>`;
        return;
      }

      tableBody.innerHTML = rows.map((row) => `
        <tr>
          <td>${escapeHtml(row.itemName)}</td>
          <td>${formatNumber(row.before)}</td>
          <td>${formatNumber(row.after)}</td>
          <td class="${numberClass(row.change)}">${signedNumber(row.change)}</td>
          <td class="${numberClass(row.changeRate)}">${formatPercent(row.changeRate)}</td>
          <td><span class="status ${statusClass(row.status)}">${row.status}</span></td>
        </tr>
      `).join("");
    }

    function sortPerformanceTable(key) {
      if (!state.result) return;
      if (state.sortKey === key) {
        state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
      } else {
        state.sortKey = key;
        state.sortDir = "asc";
      }
      renderPerformanceTable();
    }

    function compareValues(a, b, direction) {
      const order = direction === "asc" ? 1 : -1;
      if (typeof a === "number" && typeof b === "number") return (a - b) * order;
      return String(a).localeCompare(String(b), "ko") * order;
    }

    function updateSortIndicators() {
      document.querySelectorAll("th[data-sort]").forEach((th) => {
        const span = th.querySelector(".sort");
        span.textContent = state.sortKey === th.dataset.sort ? (state.sortDir === "asc" ? "▲" : "▼") : "";
      });
    }

    function clearSort() {
      state.sortKey = null;
      state.sortDir = "asc";
      updateSortIndicators();
    }

    function resetAnalysis() {
      campaignInput.value = "";
      state.result = null;
      state.filter = "전체";
      statusFilter.value = "전체";
      clearSort();
      renderInitialState();
      showMessage("분석 결과를 초기화했습니다.", "success");
    }

    function renderInitialState() {
      summary.innerHTML = "";
      resultCount.textContent = `교차상품 항목 ${formatNumber(CROSS_ITEMS.length)}개`;
      tableBody.innerHTML = CROSS_ITEMS.map(([, label]) => `
        <tr>
          <td>${escapeHtml(label)}</td>
          <td>-</td>
          <td>-</td>
          <td>-</td>
          <td>-</td>
          <td><span class="status flat">대기</span></td>
        </tr>
      `).join("");
    }

    function showMessage(text, type = "") {
      message.textContent = text;
      message.className = `message show ${type}`.trim();
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString("ko-KR");
    }

    function signedNumber(value) {
      const number = Number(value || 0);
      if (number > 0) return `+${formatNumber(number)}`;
      return formatNumber(number);
    }

    function formatPercent(value) {
      const number = Number(value || 0);
      const prefix = number > 0 ? "+" : "";
      return `${prefix}${number.toFixed(1)}%`;
    }

    function numberClass(value) {
      const number = Number(value || 0);
      if (number > 0) return "positive";
      if (number < 0) return "negative";
      return "";
    }

    function valueClass(value) {
      if (String(value).startsWith("+")) return "positive";
      if (String(value).startsWith("-")) return "negative";
      return "";
    }

    function statusClass(status) {
      if (status === "증가") return "up";
      if (status === "감소") return "down";
      return "flat";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }
  </script>
</body>
</html>
